name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chulgunhaza
          MYSQL_USER: chulgunhaza
          MYSQL_PASSWORD: local1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # local dev와 동일한 계약(.env)을 CI 서비스 컨테이너 기준으로 맞춘 값.
      # 전부 CI 안에서만 쓰는 임시 컨테이너용 값이라 민감정보 아님 — repo secrets 불필요.
      DATABASE_URL: jdbc:mysql://127.0.0.1:3306/chulgunhaza?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DATABASE_USER: chulgunhaza
      DATABASE_PASSWORD: local1234
      SPRING_REDIS_HOST: 127.0.0.1
      SPRING_REDIS_PASS: ""
      UPLOAD_DIR: ./uploads
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uchulgunhaza -plocal1234 --silent && break
            echo "waiting for mysql... ($i)"
            sleep 2
          done

      - name: Run tests
        run: ./gradlew clean test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

      - name: Build jar
        run: ./gradlew bootJar --no-daemon
