name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chulgunhaza_user
          MYSQL_USER: chulgunhaza
          MYSQL_PASSWORD: local1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # local dev와 동일한 계약(.env)을 CI 서비스 컨테이너 기준으로 맞춘 값.
      # 전부 CI 안에서만 쓰는 임시 컨테이너용 값이라 민감정보 아님 — repo secrets 불필요.
      DATABASE_URL: jdbc:mysql://127.0.0.1:3306/chulgunhaza_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DATABASE_USER: chulgunhaza
      DATABASE_PASSWORD: local1234
      # #101: chatting-server의 ChatRoomServiceImplQueryCountTest가 실제 DB에 붙는
      # @SpringBootTest라 별도 스키마가 필요하다. MYSQL_DATABASE는 컨테이너 기동
      # 시 스키마를 하나만 만들어주므로, chulgunhaza_chatting은 아래 "Create
      # additional schemas" 스텝에서 따로 만든다(로컬 .env의 CHATTING_DATABASE_URL과
      # 동일한 계약).
      CHATTING_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/chulgunhaza_chatting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_REDIS_HOST: 127.0.0.1
      SPRING_REDIS_PASS: ""
      UPLOAD_DIR: ./uploads
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # #98(JWT): CI 전용 테스트 키페어. 로컬 .env의 키와는 다른 별개 키이고, CI
      # 컨테이너 안에서만 쓰는 값이라 민감정보 아님 — repo secrets 불필요.
      # (#99에서 발견: 이 값이 없어서 JwtKeyProvider의 @PostConstruct가 Base64
      # 디코딩에 실패해 CI 테스트가 전부 깨지고 있었음 — main 브랜치에서 실측 확인)
      JWT_PRIVATE_KEY: 
      JWT_PUBLIC_KEY: 

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uchulgunhaza -plocal1234 --silent && break
            echo "waiting for mysql... ($i)"
            sleep 2
          done

      # #101: chulgunhaza_user는 MYSQL_DATABASE로 컨테이너가 이미 만들어주지만,
      # chulgunhaza_chatting은 chatting-server 전용 스키마라 여기서 따로 만들고
      # chulgunhaza 유저에게 권한을 준다(chulgunhaza 유저는 기본적으로
      # MYSQL_DATABASE 스키마에만 권한이 있음 — 공식 mysql 이미지 동작).
      - name: Create additional schemas
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS chulgunhaza_chatting;
            GRANT ALL PRIVILEGES ON chulgunhaza_chatting.* TO 'chulgunhaza'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Run tests
        run: ./gradlew clean test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          # #99: 멀티모듈이라 리포트가 루트가 아니라 서브프로젝트별 build/에 생김
          path: '*/build/reports/tests/test'
          retention-days: 7

      - name: Build jars
        # #99: 멀티모듈 전환으로 루트엔 더 이상 spring-boot 플러그인이 없어서
        # 부팅 가능한 서비스 모듈 3개를 각각 지정해야 한다.
        run: ./gradlew :user-server:bootJar :attendance-server:bootJar :chatting-server:bootJar --no-daemon
