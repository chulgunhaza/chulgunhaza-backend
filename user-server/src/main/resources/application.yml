
# #101: 명시적으로 8081을 고정한다 — attendance-server(:8082)/chatting-server(:8083)가
# 이 서비스를 부를 때 쓰는 내부 API 기본값(user-server.internal-url 등)이 전부 8081을
# 전제하는데, 여기 server.port 지정이 없어서 실제로는 Spring 기본값인 8080으로
# 떠 있었다 — chatting-server를 로컬에서 띄우고 서비스 간 호출을 실측하다가 발견
# (EmployeeDirectoryClient가 8081로 호출하는데 아무도 안 듣고 있어서 커넥션 실패).
server:
  port: 8081

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # auto-update schema (optional)
    show-sql: true      # SQL 쿼리 출력 (optional)
    properties:
      hibernate:
        format_sql: true # SQL 포맷팅 (optional)
  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      password: ${SPRING_REDIS_PASS}
      port: 6379

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true                 # multipart 업로드 기능 활성화
      max-file-size: 10MB           # 최대 파일 크기 설정
      max-request-size: 10MB        # 최대 요청 크기 설정
      file-size-threshold: 2KB      # 파일을 디스크에 저장하기 전에 메모리에 보관할 최소 크기 설정

file:
  upload-dir: ${UPLOAD_DIR}

# #54: CORS 허용 origin 화이트리스트. 콤마로 구분된 값을 넣으면 여러 개 등록 가능.
# 운영 배포 시 CORS_ALLOWED_ORIGINS 환경변수로 실제 프론트 도메인을 지정할 것.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# #98: 세션(Spring Session Redis) → JWT(RS256) 전환.
# private/public key는 PEM을 base64 한 줄로 인코딩해서 담아둔다(.env, .gitignore 대상).
# key가 나중에 attendance/chatting-server로 분리되면 public key만 그쪽에 배포하면 된다.
jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900} # 15분
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800} # 7일
  cookie-domain: ${JWT_COOKIE_DOMAIN:} # 비우면 요청 호스트 그대로, 운영에서 서브도메인 공유 시 .chulgunhaza.com 등으로
  cookie-secure: ${JWT_COOKIE_SECURE:false} # 로컬은 http라 false, 운영(https)에서는 true
  # #100: 서비스별로 다른 예외 경로를 가질 수 있도록 JwtAuthenticationFilter에서
  # 하드코딩을 빼고 여기로 옮겼다. user-server는 로그인/재발급/swagger, 그리고
  # #101부터는 다른 서비스가 호출하는 /internal(예: /internal/employees)이 예외.
  auth:
    exempt-path-prefixes:
      - /v1/employee/login
      - /v1/employee/token/refresh
      - /swagger-ui
      - /v3/api-docs
      - /internal

# #100: attendance-server가 물리 분리되면서 대시보드 통계(오늘 출근 수)가
# 더 이상 로컬 리포지토리 조회가 아니라 내부 API 호출이 됐다.
attendance-server:
  internal-url: ${ATTENDANCE_SERVER_INTERNAL_URL:http://localhost:8082}
